<!DOCTYPE html>
<html>
<head>
    <title>Todo MVC con Peewee</title>
    <style>
        .todo-list {
            max-width: 600px;
            margin: 30px auto;
            padding: 20px;
            font-family: Arial, sans-serif;
        }
        .todo-form {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }
        .todo-form input {
            flex: 1;
            padding: 8px;
            border: 1px solid #ddd;
            border-radius: 4px;
        }
        .todo-form button {
            padding: 8px 16px;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        .todo-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px;
            margin: 5px 0;
            background-color: #f9f9f9;
            border-radius: 4px;
        }
        .todo-item.done {
            background-color: #e9e9e9;
        }
        .todo-item.done .todo-title {
            text-decoration: line-through;
            color: #666;
        }
        .todo-date {
            font-size: 0.8em;
            color: #666;
        }
        .complete-btn {
            padding: 4px 8px;
            background-color: #2196F3;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            text-decoration: none;
            font-size: 0.8em;
        }
    </style>
</head>
<body>
    <div class="todo-list">
        <h1>Lista de Tareas</h1>

        <form class="todo-form" action="{{ url_for('add') }}" method="post">
            <input type="text" name="title" placeholder="Nueva tarea" required>
            <button type="submit">Agregar</button>
        </form>

        <div class="todos">
            {% for todo in todos %}
                <div class="todo-item {{ 'done' if todo.done }}">
                    <div>
                        <span class="todo-title">{{ todo.title }}</span>
                        <div class="todo-date">{{ todo.created_at.strftime('%Y-%m-%d %H:%M') }}</div>
                    </div>
                    {% if not todo.done %}
                        <a class="complete-btn" href="{{ url_for('complete', todo_id=todo.id) }}">Completar</a>
                    {% endif %}
                </div>
            {% endfor %}
        </div>
    </div>
</body>
</html>
